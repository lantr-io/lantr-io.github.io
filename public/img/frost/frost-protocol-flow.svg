<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
    </marker>
    <style>
      text { font-size: 13px; fill: #333; }
      .heading { font-size: 15px; font-weight: 700; fill: #1e293b; }
      .round-label { font-size: 14px; font-weight: 700; }
      .step { font-size: 12px; fill: #555; }
      .math { font-style: italic; font-size: 12px; fill: #666; }
      .entity { font-size: 14px; font-weight: 700; }
      .note { font-size: 11px; fill: #888; font-style: italic; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="700" height="520" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" class="heading">FROST Protocol Flow (2-of-3 threshold signing)</text>

  <!-- Entity boxes -->
  <!-- P1 -->
  <rect x="40" y="48" width="100" height="36" rx="6" fill="#2563eb" opacity="0.1" stroke="#2563eb" stroke-width="1.5"/>
  <text x="90" y="72" text-anchor="middle" class="entity" fill="#2563eb">P&#x2081;</text>

  <!-- P2 -->
  <rect x="220" y="48" width="100" height="36" rx="6" fill="#2563eb" opacity="0.1" stroke="#2563eb" stroke-width="1.5"/>
  <text x="270" y="72" text-anchor="middle" class="entity" fill="#2563eb">P&#x2082;</text>

  <!-- P3 (offline) -->
  <rect x="400" y="48" width="100" height="36" rx="6" fill="#94a3b8" opacity="0.15" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="450" y="68" text-anchor="middle" class="entity" fill="#94a3b8">P&#x2083;</text>
  <text x="450" y="80" text-anchor="middle" class="note" fill="#94a3b8">(offline)</text>

  <!-- Coordinator -->
  <rect x="560" y="48" width="120" height="36" rx="6" fill="#7c3aed" opacity="0.1" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="620" y="72" text-anchor="middle" class="entity" fill="#7c3aed">Coordinator</text>

  <!-- Vertical lifelines -->
  <line x1="90" y1="84" x2="90" y2="490" stroke="#2563eb" stroke-width="1" opacity="0.3"/>
  <line x1="270" y1="84" x2="270" y2="490" stroke="#2563eb" stroke-width="1" opacity="0.3"/>
  <line x1="450" y1="84" x2="450" y2="120" stroke="#94a3b8" stroke-width="1" opacity="0.2" stroke-dasharray="4,3"/>
  <line x1="620" y1="84" x2="620" y2="490" stroke="#7c3aed" stroke-width="1" opacity="0.3"/>

  <!-- ===== Round 1: Commitment ===== -->
  <rect x="10" y="105" width="680" height="130" rx="6" fill="#2563eb" opacity="0.04" stroke="#2563eb" stroke-width="0.5"/>
  <text x="24" y="124" class="round-label" fill="#2563eb">Round 1: Commitment</text>

  <!-- P1 generates nonces -->
  <rect x="28" y="134" width="124" height="34" rx="4" fill="#fff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="90" y="148" text-anchor="middle" class="step">Generate d&#x2081;, e&#x2081;</text>
  <text x="90" y="162" text-anchor="middle" class="math">D&#x2081; = d&#x2081;G, E&#x2081; = e&#x2081;G</text>

  <!-- P2 generates nonces -->
  <rect x="208" y="134" width="124" height="34" rx="4" fill="#fff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="270" y="148" text-anchor="middle" class="step">Generate d&#x2082;, e&#x2082;</text>
  <text x="270" y="162" text-anchor="middle" class="math">D&#x2082; = d&#x2082;G, E&#x2082; = e&#x2082;G</text>

  <!-- Send commitments to Coordinator -->
  <line x1="152" y1="185" x2="610" y2="185" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="380" y="180" text-anchor="middle" class="step" fill="#2563eb">(D&#x2081;, E&#x2081;)</text>

  <line x1="332" y1="200" x2="610" y2="200" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="470" y="216" text-anchor="middle" class="step" fill="#2563eb">(D&#x2082;, E&#x2082;)</text>

  <!-- ===== Round 2: Signature Share ===== -->
  <rect x="10" y="245" width="680" height="180" rx="6" fill="#16a34a" opacity="0.04" stroke="#16a34a" stroke-width="0.5"/>
  <text x="24" y="264" class="round-label" fill="#16a34a">Round 2: Signature Share</text>

  <!-- Coordinator broadcasts -->
  <line x1="610" y1="280" x2="100" y2="280" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="610" y1="280" x2="280" y2="280" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="380" y="274" text-anchor="middle" class="step" fill="#7c3aed">Broadcast: message m, all (D&#x209a;, E&#x209a;)</text>

  <!-- P1 computes -->
  <rect x="22" y="296" width="136" height="50" rx="4" fill="#fff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="90" y="312" text-anchor="middle" class="step">Compute &#x03C1;&#x209a;, R, c, &#x03BB;&#x2081;</text>
  <text x="90" y="326" text-anchor="middle" class="math">z&#x2081; = d&#x2081; + &#x03C1;&#x2081;e&#x2081; + &#x03BB;&#x2081;s&#x2081;c</text>
  <text x="90" y="340" text-anchor="middle" class="note">delete d&#x2081;, e&#x2081;</text>

  <!-- P2 computes -->
  <rect x="202" y="296" width="136" height="50" rx="4" fill="#fff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="270" y="312" text-anchor="middle" class="step">Compute &#x03C1;&#x209a;, R, c, &#x03BB;&#x2082;</text>
  <text x="270" y="326" text-anchor="middle" class="math">z&#x2082; = d&#x2082; + &#x03C1;&#x2082;e&#x2082; + &#x03BB;&#x2082;s&#x2082;c</text>
  <text x="270" y="340" text-anchor="middle" class="note">delete d&#x2082;, e&#x2082;</text>

  <!-- Send shares to Coordinator -->
  <line x1="152" y1="370" x2="610" y2="370" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="380" y="365" text-anchor="middle" class="step" fill="#16a34a">z&#x2081;</text>

  <line x1="332" y1="390" x2="610" y2="390" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="470" y="407" text-anchor="middle" class="step" fill="#16a34a">z&#x2082;</text>

  <!-- ===== Aggregation ===== -->
  <rect x="10" y="435" width="680" height="74" rx="6" fill="#7c3aed" opacity="0.04" stroke="#7c3aed" stroke-width="0.5"/>
  <text x="24" y="454" class="round-label" fill="#7c3aed">Aggregation</text>

  <!-- Coordinator aggregates -->
  <rect x="556" y="460" width="128" height="38" rx="4" fill="#fff" stroke="#7c3aed" stroke-width="1"/>
  <text x="620" y="476" text-anchor="middle" class="step" fill="#7c3aed">Verify shares</text>
  <text x="620" y="491" text-anchor="middle" class="math" fill="#7c3aed">&#x03C3; = (R, z&#x2081;+z&#x2082;)</text>

  <!-- Output arrow -->
  <text x="450" y="484" text-anchor="middle" class="entity" fill="#7c3aed">&#x2190; Schnorr signature &#x03C3;</text>
</svg>